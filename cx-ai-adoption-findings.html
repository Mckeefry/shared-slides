  <style>
:root{--bg:#07131f;--panel:#0d2032;--ink:#ecf4ff;--muted:#a8c2df;--accent:#22d3ee;--accent2:#7dd3fc;--good:#34d399;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;font-family:"Bahnschrift","Avenir Next","Trebuchet MS",sans-serif;background:radial-gradient(circle at 20% 10%,#123556 0%,var(--bg) 45%,#050b13 100%);color:var(--ink);min-height:100vh}
.deck{width:min(1200px,94vw);margin:2vh auto}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-bar span{color:var(--muted);font-size:13px;margin-right:4px}
.fbtn{border:1px solid rgba(125,211,252,.35);background:rgba(7,19,31,.7);color:var(--muted);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13px;transition:all .2s}
.fbtn.active,.fbtn:hover{background:var(--accent);color:#07131f;border-color:var(--accent);font-weight:700}
.slide{display:none;background:linear-gradient(145deg,rgba(13,32,50,.95),rgba(8,20,33,.92));border:1px solid rgba(125,211,252,.25);border-radius:20px;padding:44px;min-height:80vh;animation:rise 360ms ease}
.slide.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
h1{margin:0 0 8px;font-size:clamp(28px,4vw,48px)}
h2{margin:8px 0 18px;color:var(--accent2);font-size:clamp(18px,2.2vw,28px);font-weight:600}
p,li{line-height:1.5}
.sub{color:var(--muted);max-width:960px;margin-bottom:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid rgba(125,211,252,.22);border-radius:14px;padding:14px 16px;background:rgba(10,25,40,.55)}
.kpi{font-size:clamp(22px,3vw,40px);font-weight:700;color:var(--accent);margin:4px 0}
.lbl{color:var(--muted);font-size:13px}
.bars{margin-top:6px;display:grid;gap:8px}
.br{display:grid;grid-template-columns:200px 1fr 90px;align-items:center;gap:8px;font-size:13px}
.bar{height:11px;border-radius:999px;overflow:hidden;background:rgba(168,194,223,.2)}
.fill{height:100%;background:linear-gradient(90deg,#22d3ee,#34d399)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.chip{border:1px solid rgba(125,211,252,.35);background:rgba(7,19,31,.75);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.warn{color:var(--warn);font-weight:700}
.good{color:var(--good);font-weight:700}
.footer{margin-top:16px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;align-items:center}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(168,194,223,.35);border:none;cursor:pointer;padding:0}
.dot.active{background:var(--accent)}
.btn{border:1px solid rgba(125,211,252,.35);background:rgba(7,19,31,.7);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
tbl{width:100%;font-size:12px;border-collapse:collapse;margin-top:6px}
th{color:var(--muted);font-weight:600;padding:3px 4px;text-align:left}
td{padding:3px 4px;border-top:1px solid rgba(125,211,252,.08)}
.tc{text-align:center}
ol.tight{margin:4px 0 0;padding-left:18px;font-size:12px;line-height:1.8}
@media(max-width:900px){.slide{padding:22px;min-height:72vh}.g2{grid-template-columns:1fr}.br{grid-template-columns:130px 1fr 70px}}
</style>
</head>

const MONTHS = RAW.months;
const SALES_FILTERS = RAW.sales_filters || ['Y','N','Both'];
let selectedMonths = new Set();   // empty = show All
let currentMonth = "All";         // display label only
let salesMode = 'Both';

// ── utils ──────────────────────────────────────────────────────────
const n   = v => (v ?? 0).toLocaleString();
const pct = v => (v ?? 0).toFixed(1) + "%";
const p2  = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;  // numeric pct for merge
const clr = (v, hi=50, lo=20) => v >= hi ? 'warn' : v <= lo ? 'good' : '';
const bar = (p, max=100) => `<div class="bar"><div class="fill" style="width:${Math.min(p/max*100,100)}%"></div></div>`;
const salesLabel = () => salesMode === 'Both' ? 'Y + N' : salesMode;
const scopeLabel = () => `${currentMonth} | Sales ${salesLabel()}`;

// ── render helpers ────────────────────────────────────────────────
function kpiCard(label, value, sub='') {
  return `<div class="card"><div class="lbl">${label}</div><div class="kpi">${value}</div><div class="lbl">${sub}</div></div>`;
}
function tableHead(...cols){
  return `<thead><tr>${cols.map(c=>`<th class="${c[1]||''}">${c[0]}</th>`).join('')}</tr></thead>`;
}
function intent_color(intent){
  const map={Risk:'warn','Opportunity Pipeline':'','Deals':'','Customers':'good',Sales:''};
  return map[intent]||'';
}

// ── slide 1: Overview ─────────────────────────────────────────────
function renderSlide1(d) {
  const ov = d.overview;
  const topIntent = d.intent.dist[0] || {};
  const topRegion = d.intent.by_region?.[topIntent.intent]?.[0]?.region || 'Americas';
  return `
  <h1>CX AI Assistant Adoption Findings</h1>
  <h2>Initial Question Intent Analysis | ${scopeLabel()}</h2>
  <p class="sub">Corrected source upload. Intent filter applied to initial prompts only (Previous&nbsp;Input blank).</p>
  <div class="g2">
    ${kpiCard('Total Prompts', n(ov.total), 'All prompts in selected period')}
    ${kpiCard('Initial Prompts', n(ov.input), pct(ov.input_pct) + ' of all prompts')}
    ${kpiCard('Follow-up Prompts', n(ov.follow), pct(ov.follow_pct) + ' of all prompts')}
    <div class="card"><div class="lbl">Core Insight</div>
      <p style="margin:6px 0 0">Initial usage is strongly operational — risk, pipeline, deals and customer/account asks dominate front-door demand.</p>
    </div>
  </div>
  <div class="chips">
    <span class="chip">Top intent: ${topIntent.intent||'—'} (${pct(topIntent.pct||0)})</span>
    <span class="chip">Largest region: ${topRegion}</span>
    <span class="chip">Peak initial day: ${peakDay(d.activity.init_by_day)}</span>
  </div>`;
}

function peakDay(byDay) {
  return Object.entries(byDay||{}).sort((a,b)=>b[1]-a[1])[0]?.[0] || '—';
}

// ── slide 2: Intent distribution ─────────────────────────────────
function renderSlide2(d) {
  const dist = d.intent.dist || [];
  const total = dist.reduce((s,r)=>s+r.count,0);
  const maxP  = Math.max(...dist.map(r=>r.pct));
  const rows  = dist.map(r=>`
    <div class="br"><span>${r.intent}</span>${bar(r.pct,maxP)}<strong>${pct(r.pct)}</strong></div>`).join('');
  return `
  <h1>Nature Of Initial Questions</h1>
  <h2>Intent mix across first prompts — ${scopeLabel()}</h2>
  <p class="sub">Initial prompts reclassified into business intents. ${n(total)} initial prompts in scope.</p>
  <div class="bars">${rows}</div>
  <div class="g2" style="margin-top:12px">
    <div class="card"><strong>Intent takeaway</strong><ul>
      <li>Risk + Pipeline together: ${pct(dist.filter(r=>r.intent==='Risk'||r.intent==='Opportunity Pipeline').reduce((s,r)=>s+r.pct,0))} of initial demand</li>
      <li>Deals + Customers add another ${pct(dist.filter(r=>r.intent==='Deals'||r.intent==='Customers').reduce((s,r)=>s+r.pct,0))}</li>
      <li>Questions are centered on execution and decision support</li>
    </ul></div>
    <div class="card"><strong>Coverage note</strong><ul>
      <li>${pct(dist.find(r=>r.intent==='Other')?.pct||0)} remains in Other — most demand is captured</li>
      <li>Intent model creates a strong baseline for enablement targeting</li>
    </ul></div>
  </div>`;
}

// ── slide 3: Intent by role & region ─────────────────────────────
function renderSlide3(d) {
  const intents = ['Risk','Opportunity Pipeline','Deals','Customers','Sales'];
  const cards = intents.map(intent => {
    const regions = (d.intent.by_region?.[intent]||[]).slice(0,4);
    const titles  = (d.intent.by_title?.[intent]||[]).slice(0,3);
    return `<div class="card"><strong>${intent} intent</strong>
      <ul>
        ${regions.map(r=>`<li>Region: ${r.Region||r.region||'—'} ${n(r.count)}</li>`).join('')}
        ${titles.map(t=>`<li>${(t.Title||t.title||'').replace('Director,','Dir,').replace('Specialist','Spec')}: ${n(t.count)}</li>`).join('')}
      </ul></div>`;
  }).join('');
  return `
  <h1>Intent By Role And Region</h1>
  <h2>Who asks what first — ${scopeLabel()}</h2>
  <p class="sub">Each intent has distinct role and regional concentration, enabling targeted adoption plans.</p>
  <div class="g2">${cards}</div>`;
}

    <div class="card"><strong>Initial prompts by day</strong><div class="bars" style="margin-top:8px">${initRows}</div></div>

  </div>`;
}

  const cards = patterns.length === 0

  <h2>Automated or recurring prompt patterns — ${scopeLabel()}</h2>

  <p class="sub">${n(div.analysed_users)} users analysed (≥ 5 initial prompts). <span class="warn">${n(div.library_count)}</span> library-likely (repeat &gt;50%). <span class="good">${n(div.diverse_count)}</span> diverse explorers (&lt;15%).</p>
  <div class="g2">
    <div class="card"><strong>Library-likely users (top 10, repeat &gt; 50%)</strong>
      <table class="tbl">${tableHead(['User'],['Initial','tc'],['Repeat %','tc'],['Top prompt',''])}
      <tbody>${libRows}</tbody></table></div>
    <div class="card"><strong>Most diverse users (top 8, repeat &lt; 15%)</strong>
      <table class="tbl">${tableHead(['User'],['Initial','tc'],['Unique','tc'],['Repeat %','tc'])}
      <tbody>${divRows}</tbody></table></div>
    <div class="card"><strong>Avg repeat % by title</strong>
      <table class="tbl">${tableHead(['Title'],['Users','tc'],['Initial prompts','tc'],['Avg repeat %','tc'])}
      <tbody>${titRows}</tbody></table></div>
    <div class="card"><strong>Avg repeat % by region</strong>
      <table class="tbl">${tableHead(['Region'],['Users','tc'],['Initial prompts','tc'],['Avg repeat %','tc'])}
      <tbody>${regRows}</tbody></table>
      <p style="margin-top:8px;font-size:12px">Highest repeat % = likely template/library-driven usage.</p></div>
  </div>`;
}

// ── slide 9: Adoption actions (static) ────────────────────────────

// ── slide 10: Latency analysis ───────────────────────────────────────
function renderSlide10(d) {
  const lat = d.latency;
  if (!lat || !lat.has_data) {
    return `<h1>Latency Analysis</h1><p class="sub">No latency data available for this period.</p>`;
  }
  const ov = lat.overall || {};
  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const maxDay = Math.max(...DAYS.map(day => lat.by_day?.[day] || 0), 1);
  const dayRows = DAYS.map(day => {
    const v = lat.by_day?.[day];
    return `<div class="br"><span>${day}</span>${v != null ? bar(v, maxDay) : '<div class="bar"></div>'}<strong>${v != null ? v + 's' : '—'}</strong></div>`;
  }).join('');

  const intents = (lat.by_intent || []).filter(r => r.intent && r.n >= 10);
  const maxInt = Math.max(...intents.map(r => r.median || 0), 1);
  const intentRows = intents.map(r =>
    `<div class="br"><span>${r.intent}</span>${bar(r.median, maxInt)}<strong>${r.median}s</strong></div>`
  ).join('');

  const trend = lat.month_trend || [];
  const maxTrend = Math.max(...trend.map(t => t.median || 0), 1);
  const trendRows = trend.map(t =>
    `<div class="br"><span>${t.month}</span>${bar(t.median, maxTrend)}<strong>${t.median}s</strong></div>`
  ).join('');

  const dist = lat.distribution || {};
  const distTotal = Object.values(dist).reduce((s, v) => s + v, 0) || 1;
  const distRows = Object.entries(dist).map(([k, v]) =>
    `<div class="br"><span>${k}</span>${bar(v, distTotal)}<strong>${n(v)} (${Math.round(v/distTotal*100)}%)</strong></div>`
  ).join('');

  // trend direction
  let trendNote = trend.length < 2 ? 'Select <strong>All</strong> to see the full cross-month trend.' : '';
  if (trend.length >= 2) {
    const diff = (trend[trend.length-1]?.median||0) - (trend[0]?.median||0);
    if (Math.abs(diff) < 2) trendNote = 'Latency is broadly <strong>stable</strong> across the period.';
    else if (diff > 0) trendNote = `Latency has <span class="warn">increased ~${diff.toFixed(1)}s</span> from ${trend[0].month} to ${trend[trend.length-1].month}.`;
    else trendNote = `Latency has <span class="good">improved ~${Math.abs(diff).toFixed(1)}s</span> from ${trend[0].month} to ${trend[trend.length-1].month}.`;
  }

  const peakDay  = DAYS.filter(d=>lat.by_day?.[d]!=null).reduce((a,d)=>(lat.by_day[d]||0)>(lat.by_day[a]||0)?d:a, 'Monday');
  const troughDay= DAYS.filter(d=>lat.by_day?.[d]!=null).reduce((a,d)=>(lat.by_day[d]||999)<(lat.by_day[a]||999)?d:a, 'Monday');
  const slowIntent = intents[0]?.intent || '—';
  const fastIntent = intents[intents.length-1]?.intent || '—';
  const pctFast = Math.round(((dist['< 10s']||0)+(dist['10\u201330s']||0))/distTotal*100);
  const pctSlow = Math.round(((dist['60\u2013120s']||0)+(dist['> 120s']||0))/distTotal*100);

  return `
  <h1>Latency Analysis</h1>
  <h2>Response time patterns and trends — ${scopeLabel()}</h2>
  <p class="sub">
    Response times capped at 3,600s (1 hr) to exclude timeouts. ${n(ov.n)} prompts analysed.
    Median: <strong>${ov.median}s</strong> · Mean: <strong>${ov.mean}s</strong> · P95: <strong>${ov.p95}s</strong>
  </p>
  <div class="g2">
    <div class="card"><strong>Monthly latency trend (median seconds)</strong>
      <p style="font-size:12px;margin:4px 0 8px">${trendNote}</p>
      <div class="bars">${trendRows || '<p style="font-size:12px;color:var(--muted)">No cross-month data in current selection.</p>'}</div>
    </div>
    <div class="card"><strong>Latency by day of week (median seconds)</strong>
      <div class="bars">${dayRows}</div>
      <p style="font-size:12px;margin-top:6px">Slowest: <span class="warn">${peakDay}</span> · Fastest: <span class="good">${troughDay}</span></p>
    </div>
    <div class="card"><strong>Latency by prompt intent (median seconds)</strong>
      <div class="bars">${intentRows || '<p style="font-size:12px;color:var(--muted)">Insufficient data.</p>'}</div>
      <p style="font-size:12px;margin-top:6px">Slowest: <span class="warn">${slowIntent}</span> · Fastest: <span class="good">${fastIntent}</span></p>
      <p style="font-size:12px">Higher-latency intent types suggest more complex underlying queries.</p>
    </div>
    <div class="card"><strong>Response time distribution</strong>
      <div class="bars">${distRows}</div>
      <p style="font-size:12px;margin-top:6px">
        <span class="good">${pctFast}%</span> under 30s &nbsp;·&nbsp;
        <span class="${pctSlow>20?'warn':''} ">${pctSlow}%</span> over 60s
      </p>
      <p style="font-size:12px;margin-top:4px">
        ${pctSlow > 20
          ? 'High share of slow responses (&gt;60s) may discourage repeat usage. Investigate complex query patterns.'
          : 'Majority of responses fall within acceptable operational range.'}
      </p>
    </div>
  </div>`;
}

const RENDERERS = [renderSlide1,renderSlide2,renderSlide3,renderSlide4,renderSlide5,renderSlide6,renderSlide7,renderSlide8,renderSlide10,renderSlide9];
const N = RENDERERS.length;
let index = 0;
let dots = [];

// ── multi-month merge ──────────────────────────────────────────────
function getActiveData() {
  const pick = (monthLabel) => {
    if (RAW.data?.[salesMode]?.[monthLabel]) return RAW.data[salesMode][monthLabel];
    // Backward compatibility with older flat data shape
    if (RAW.data?.[monthLabel]) return RAW.data[monthLabel];
    return null;
  };

  if (selectedMonths.size === 0) return pick('All') || pick('April');
  if (selectedMonths.size === 1) return pick([...selectedMonths][0]) || pick('All');
  const slices = [...selectedMonths].map(m => pick(m)).filter(Boolean);
  return slices.length ? mergeSlices(slices) : (pick('All') || pick('April'));
}

function mergeSlices(slices) {
  const total  = slices.reduce((s,sl)=>s+(sl.overview.total||0),0);
  const input  = slices.reduce((s,sl)=>s+(sl.overview.input||0),0);
  const follow = slices.reduce((s,sl)=>s+(sl.overview.follow||0),0);

  // intent dist
  const iM=new Map();
  slices.forEach(s=>(s.intent.dist||[]).forEach(r=>iM.set(r.intent,(iM.get(r.intent)||0)+r.count)));
  const dist=[...iM.entries()].sort((a,b)=>b[1]-a[1]).map(([intent,count])=>({intent,count,pct:p2(count,input)}));

  // intent by_region / by_title — source keys are capitalised (Region, Title)
  function mergeDim(key,kf){
    const out={};
    new Set(slices.flatMap(s=>Object.keys(s.intent[key]||{}))).forEach(intent=>{
      const m2=new Map();
      slices.forEach(s=>(s.intent[key]?.[intent]||[]).forEach(r=>m2.set(r[kf],(m2.get(r[kf])||0)+r.count)));
      out[intent]=[...m2.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>({[kf]:k,count:v}));
    });
    return out;
  }

  // activity by day
  const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const id={},fd={};
  DAYS.forEach(d=>{
    id[d]=slices.reduce((s,sl)=>s+((sl.activity.init_by_day||{})[d]||0),0);
    fd[d]=slices.reduce((s,sl)=>s+((sl.activity.follow_by_day||{})[d]||0),0);
  });

  // weekend
  const wAll=slices.reduce((s,sl)=>s+(sl.weekend.all||0),0);
  const wInit=slices.reduce((s,sl)=>s+(sl.weekend.init||0),0);
  const rM=new Map(),tM=new Map(),wiM=new Map(),uM=new Map();
  slices.forEach(s=>{
    (s.weekend.by_region||[]).forEach(r=>rM.set(r.region,(rM.get(r.region)||0)+r.count));
    (s.weekend.by_title||[]).forEach(r=>tM.set(r.title,(tM.get(r.title)||0)+r.count));
    (s.weekend.intent_dist||[]).forEach(r=>wiM.set(r.intent,(wiM.get(r.intent)||0)+r.count));
    (s.weekend.top_users||[]).forEach(u=>uM.set(u.name,(uM.get(u.name)||0)+u.count));
  });
  const topU=[...uM.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10).map(([name,count])=>({name,count,pct:p2(count,wAll)}));
  const big=slices.reduce((a,b)=>a.overview.total>b.overview.total?a:b);

  // regular users
  const frM=new Map();
  slices.forEach(s=>Object.entries(s.regular.freq_counts||{}).forEach(([f,c])=>frM.set(f,(frM.get(f)||0)+c)));
  function mergeTop(key){
    const uM2=new Map();
    slices.forEach(s=>(s.regular[key]||[]).forEach(u=>{
      if(!uM2.has(u.name))uM2.set(u.name,{...u,total_prompts:0});
      uM2.get(u.name).total_prompts+=u.total_prompts;
    }));
    return[...uM2.values()].sort((a,b)=>b.total_prompts-a.total_prompts).slice(0,10);
  }
  const rfM={};
  slices.forEach(s=>Object.entries(s.regular.region_freq||{}).forEach(([rg,freqs])=>{
    if(!rfM[rg])rfM[rg]={};
    Object.entries(freqs).forEach(([f,c])=>{rfM[rg][f]=(rfM[rg][f]||0)+c;});
  }));

  // scheduled — deduplicate by user+prompt, keep highest run_count
  const spM=new Map();
  slices.forEach(s=>(s.scheduled.patterns||[]).forEach(p=>{
    const k=p.user+'|'+p.prompt_preview;
    if(!spM.has(k)||p.run_count>spM.get(k).run_count)spM.set(k,p);
  }));
  const sPatterns=[...spM.values()].sort((a,b)=>b.run_count-a.run_count);
  const sCad={}; sPatterns.forEach(p=>sCad[p.cadence]=(sCad[p.cadence]||0)+1);

  // diversity — best rep_pct per user across months
  const lbM=new Map(),dvM=new Map(),tdM=new Map(),rdM=new Map();
  slices.forEach(s=>{
    (s.diversity.library_top10||[]).forEach(u=>{if(!lbM.has(u.user)||u.rep_pct>lbM.get(u.user).rep_pct)lbM.set(u.user,u);});
    (s.diversity.diverse_top10||[]).forEach(u=>{if(!dvM.has(u.user)||u.initial>dvM.get(u.user).initial)dvM.set(u.user,u);});
    (s.diversity.title_div||[]).forEach(r=>{
      if(!tdM.has(r.title))tdM.set(r.title,{title:r.title,users:0,total_initial:0,wS:0,wN:0});
      const e=tdM.get(r.title);e.users+=r.users;e.total_initial+=r.total_initial;e.wS+=r.avg_rep_pct*r.users;e.wN+=r.users;
    });
    (s.diversity.region_div||[]).forEach(r=>{
      if(!rdM.has(r.region))rdM.set(r.region,{region:r.region,users:0,total_initial:0,wS:0,wN:0});
      const e=rdM.get(r.region);e.users+=r.users;e.total_initial+=r.total_initial;e.wS+=r.avg_rep_pct*r.users;e.wN+=r.users;
    });
  });

  return {
    overview:{total,input,follow,input_pct:p2(input,total),follow_pct:p2(follow,total)},
    intent:{dist,by_region:mergeDim('by_region','Region'),by_title:mergeDim('by_title','Title')},
    activity:{init_by_day:id,follow_by_day:fd},
    weekend:{
      all:wAll,init:wInit,follow:slices.reduce((s,sl)=>s+(sl.weekend.follow||0),0),
      pct_of_all:p2(wAll,total),unique_users:big.weekend.unique_users,
      top5_share:p2(topU.slice(0,5).reduce((s,u)=>s+u.count,0),wAll),
      top10_share:p2(topU.reduce((s,u)=>s+u.count,0),wAll),
      spread_1_5:big.weekend.spread_1_5,spread_6_20:big.weekend.spread_6_20,spread_gt20:big.weekend.spread_gt20,
      by_region:[...rM.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>({region:k,count:v,pct:p2(v,wAll)})),
      by_title:[...tM.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>({title:k,count:v,pct:p2(v,wAll)})),
      intent_dist:[...wiM.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>({intent:k,count:v,pct:p2(v,wInit)})),
      top_users:topU,
    },
    regular:{
      dataset_weeks:slices.reduce((s,sl)=>s+(sl.regular.dataset_weeks||0),0),
      freq_counts:Object.fromEntries(frM),
      top10_weekly:mergeTop('top10_weekly'),top10_biweekly:mergeTop('top10_biweekly'),top10_monthly:mergeTop('top10_monthly'),
      region_freq:rfM,
    },
    scheduled:{total:sPatterns.length,cadence_summary:sCad,patterns:sPatterns},
    diversity:{
      analysed_users:big.diversity.analysed_users,
      library_count:lbM.size,diverse_count:dvM.size,
      library_top10:[...lbM.values()].sort((a,b)=>b.rep_pct-a.rep_pct).slice(0,10),
      diverse_top10:[...dvM.values()].sort((a,b)=>b.initial-a.initial).slice(0,10),
      title_div:[...tdM.values()].sort((a,b)=>b.total_initial-a.total_initial).slice(0,10).map(e=>({...e,avg_rep_pct:e.wN?e.wS/e.wN:0})),
      region_div:[...rdM.values()].sort((a,b)=>b.total_initial-a.total_initial).map(e=>({...e,avg_rep_pct:e.wN?e.wS/e.wN:0})),
    },
    latency: (() => {
      // weighted-mean merge for latency; medians are approximate
      const lSlices = slices.map(s=>s.latency).filter(l=>l&&l.has_data);
      if (!lSlices.length) return {has_data:false};
      const totalN = lSlices.reduce((s,l)=>s+(l.overall?.n||0),0);
      const wMean  = lSlices.reduce((s,l)=>s+(l.overall?.mean||0)*(l.overall?.n||0),0)/totalN;
      const wMed   = lSlices.reduce((s,l)=>s+(l.overall?.median||0)*(l.overall?.n||0),0)/totalN;
      const wP95   = lSlices.reduce((s,l)=>s+(l.overall?.p95||0)*(l.overall?.n||0),0)/totalN;
      const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
      const byDay={};
      DAYS.forEach(d=>{
        const vals=lSlices.filter(l=>l.by_day?.[d]!=null).map(l=>l.by_day[d]);
        byDay[d]=vals.length?Math.round(vals.reduce((s,v)=>s+v,0)/vals.length*10)/10:null;
      });
      const intMap=new Map();
      lSlices.forEach(l=>(l.by_intent||[]).forEach(r=>{
        if(!intMap.has(r.intent))intMap.set(r.intent,{intent:r.intent,wS:0,wN:0});
        const e=intMap.get(r.intent);e.wS+=r.median*r.n;e.wN+=r.n;
      }));
      const byIntent=[...intMap.values()].map(e=>({intent:e.intent,median:Math.round(e.wS/e.wN*10)/10,mean:Math.round(e.wS/e.wN*10)/10,n:e.wN})).sort((a,b)=>b.median-a.median);
      const allTrends=lSlices.flatMap(l=>l.month_trend||[]);
      const tMap=new Map();
      allTrends.forEach(t=>{
        if(!tMap.has(t.month))tMap.set(t.month,{month:t.month,wS:0,wN:0});
        const e=tMap.get(t.month);e.wS+=t.median*t.n;e.wN+=t.n;
      });
      const MORD=['April','May','June','July','August'];
      const monthTrend=[...tMap.values()].sort((a,b)=>MORD.indexOf(a.month)-MORD.indexOf(b.month)).map(e=>({month:e.month,median:Math.round(e.wS/e.wN*10)/10,n:e.wN}));
      const distKeys=['< 10s','10\u201330s','30\u201360s','60\u2013120s','> 120s'];
      const dist={};
      distKeys.forEach(k=>dist[k]=lSlices.reduce((s,l)=>s+(l.distribution?.[k]||0),0));
      return {has_data:true,overall:{mean:Math.round(wMean*10)/10,median:Math.round(wMed*10)/10,p95:Math.round(wP95*10)/10,n:totalN},by_day:byDay,by_intent:byIntent,month_trend:monthTrend,distribution:dist};
    })(),
  };
}

function renderAll() {
  const d = getActiveData();
  document.querySelectorAll('.slide').forEach((el, i) => {
    const fn = RENDERERS[i];
    if (!fn) return;
    try { el.innerHTML = fn(d); }
    catch(e) { el.innerHTML = `<p style="color:var(--warn)">Render error on slide ${i+1}: ${e.message}</p>`; }
  });
}

function show(i) {
  index = Math.max(0, Math.min(i, N - 1));
  document.querySelectorAll('.slide').forEach((s, n) => s.classList.toggle('active', n === index));
  dots.forEach((d, n) => d.classList.toggle('active', n === index));
  document.getElementById('page').textContent = `${index+1} / ${N}`;
}

function toggleMonth(m) {
  if (m === 'All') {
    selectedMonths.clear();
  } else {
    if (selectedMonths.has(m)) selectedMonths.delete(m);
    else selectedMonths.add(m);
  }
  currentMonth = selectedMonths.size === 0 ? 'All' : [...selectedMonths].join(' + ');
  document.querySelectorAll('.fbtn[data-m]').forEach(b => {
    if (b.dataset.m === 'All') b.classList.toggle('active', selectedMonths.size === 0);
    else b.classList.toggle('active', selectedMonths.has(b.dataset.m));
  });
  renderAll();
  show(index);
}

function toggleSales(mode) {
  salesMode = SALES_FILTERS.includes(mode) ? mode : 'Both';
  document.querySelectorAll('.fbtn[data-s]').forEach(b => {
    b.classList.toggle('active', b.dataset.s === salesMode);
  });
  renderAll();
  show(index);
}

document.addEventListener('DOMContentLoaded', () => {
  const dotsEl = document.getElementById('dots');
  for (let i = 0; i < N; i++) {
    const b = document.createElement('button');
    b.className = 'dot'; b.type = 'button';
    b.setAttribute('aria-label', `Slide ${i+1}`);
    b.addEventListener('click', () => show(i));
    dotsEl.appendChild(b);
    dots.push(b);
  }
  document.getElementById('prev').addEventListener('click', () => show(index - 1));
  document.getElementById('next').addEventListener('click', () => show(index + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') show(index + 1);
    if (e.key === 'ArrowLeft')  show(index - 1);
  });
  renderAll();
  show(0);
});

  </script>
