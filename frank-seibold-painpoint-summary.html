<html>
<head>

  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #07182D; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #07182D; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail">
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="120" fill="#07182D"></rect>
    <circle cx="60" cy="60" r="30" fill="none" stroke="#02C8FF" stroke-width="4"></circle>
    <text x="60" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="#02C8FF" font-family="sans-serif">C</text>
  </svg>
</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script>
  (function () {
    const updateSlideTwo = function () {
      const rootCause = Array.from(document.querySelectorAll('p')).find(function (paragraph) {
        return paragraph.textContent.includes('Root cause: PMG vs. Sub-BE mismatch.');
      });
      const processAmbiguity = Array.from(document.querySelectorAll('p')).find(function (paragraph) {
        return paragraph.textContent.includes('The burden of resolving overlap falls on managers');
      });
      if (!rootCause || !processAmbiguity) return false;

      rootCause.innerHTML = '<strong>Root cause:</strong> OSBO Granularity and PMG vs. Sub-BE mismatch.';
      processAmbiguity.innerHTML = 'Identifying Overlap with Renewals Center and agreeing on <strong>\'Who does What\'</strong> is required. The burden of resolving overlap falls on managers; existing prompts to flag Renewal Center involvement are limited by <strong>poor underlying data</strong>.';
      return true;
    };

    const timer = window.setInterval(function () {
      if (updateSlideTwo()) window.clearInterval(timer);
    }, 50);
  }());
  </script>

  <script>
  (function () {
    const addLeaderReviewSlide = function () {
      const stage = document.querySelector('deck-stage');
      if (!stage || stage.children.length < 4 || stage.querySelector('[data-label="Leader Review"]')) return false;

      const leaderReview = priorityOne.cloneNode(true);
      leaderReview.setAttribute('data-label', 'Leader Review');
      leaderReview.setAttribute('data-screen-label', '04 Leader Review');
      leaderReview.setAttribute('data-speaker-notes', 'Monthly Leaders Review: automate the recurring manager reports so leaders receive a consistent, current view of ATR, top-priority deals, and risky deals.');
      leaderReview.setAttribute('data-deck-slide', '3');

      leaderReview.querySelector('span').textContent = 'Agreed priority #2';
      leaderReview.querySelector('h2').textContent = 'Leader review: the agreed priority #2';
      leaderReview.querySelector('h2 + p').textContent = 'Monthly Leaders Review';

      const cards = leaderReview.querySelector('[data-dc-tpl="81"]');
      const leftCard = cards.children[0];
      const rightCard = cards.children[1];
      leftCard.innerHTML = '<div style="font-size:13px;font-weight:var(--fw-semibold);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--cisco-blue);margin-bottom:10px;">What\'s Actually Happening</div><p style="font-size:14px;line-height:1.5;color:var(--text-secondary);margin:0;">Multiple managers create multiple reports from multiple data sources every month. This work takes significant time and can be automated with the AI Assistant.</p><div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border-subtle);font-size:13px;line-height:1.55;color:var(--text-secondary);"><strong style="color:var(--text-primary);">Required reports</strong><br>1. Multiple views on ATR<br>2. Top 10 Deals by Prior ATR by Deal ID<br>3. Top 10 Risky Deals by Prior ATR by Deal ID</div>';
      rightCard.innerHTML = '<div style="font-size:13px;font-weight:var(--fw-semibold);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--accent-orange);margin-bottom:10px;">Why This Is Priority #2</div><p style="font-size:14px;line-height:1.5;color:var(--text-secondary);margin:0;">Many hours could be saved with a scheduled AI Assistant output, while ensuring greater consistency and accuracy in the monthly leadership review.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:14px;"><div style="padding:10px 12px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);font-size:12px;line-height:1.4;color:var(--text-secondary);"><strong style="display:block;color:var(--text-primary);margin-bottom:3px;">Time back</strong>Less manual report preparation</div><div style="padding:10px 12px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);font-size:12px;line-height:1.4;color:var(--text-secondary);"><strong style="display:block;color:var(--text-primary);margin-bottom:3px;">Reliability</strong>Consistent and current output</div></div>';

      const promptCard = Array.from(leaderReview.querySelectorAll('div')).find(function (element) {
        return element.textContent.trim().startsWith('Proposed New Assistant Prompt');
      });
      promptCard.innerHTML = '<div style="font-size:11px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--cisco-blue);font-weight:700;margin-bottom:6px;">Proposed New Assistant Prompt</div><div style="font-size:17px;font-weight:300;color:var(--text-primary);line-height:1.4;font-style:italic;">"Schedule my Monthly Leader Report to review Top Priorities and Risk."</div><div style="margin-top:8px;font-size:13px;color:var(--text-secondary);">Expected output: a <strong style="color:var(--cisco-blue);">consistent and up-to-date monthly report</strong> to be used with Senior Management.</div>';

      const recommendations = stage.children[3];
      recommendations.setAttribute('data-deck-slide', '4');
      recommendations.setAttribute('data-screen-label', '05 Recommendations');
      recommendations.setAttribute('data-deck-last-visible', '');
      const leaderFooter = Array.from(leaderReview.querySelectorAll('div')).find(function (element) {
        return element.textContent.includes('Cisco and/or its affiliates. All rights reserved.');
      });
      const recommendationsFooter = Array.from(recommendations.querySelectorAll('div')).find(function (element) {
        return element.textContent.includes('Cisco and/or its affiliates. All rights reserved.');
      });
      if (leaderFooter) leaderFooter.lastElementChild.textContent = '4';
      if (recommendationsFooter) recommendationsFooter.lastElementChild.textContent = '5';
      stage.insertBefore(leaderReview, recommendations);
      return true;
    };

    const timer = window.setInterval(function () {
      if (addLeaderReviewSlide()) window.clearInterval(timer);
    }, 50);
  }());

\n/* latin-ext */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"2574ff91-4ff3-4f16-91b2-46660f000eb7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"fb9b61bf-5537-4760-9298-21b48f9c1fed\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   Cisco — Color tokens\n   Source of truth: \"Cisco Dark 04-01-2026\" theme (Cisco Template.pptx)\n   Primary palette: Cisco Blue, Midnight Blue, Medium Blue, White\n   Accent palette (use SPARINGLY, small pops only): Magenta, Orange\n   ============================================================ */\n:root {\n  /* ---- Primary brand palette ---- */\n  --cisco-blue:    #02C8FF; /* bright signature blue — primary accent */\n  --midnight-blue: #07182D; /* deep navy — dark-template background & logo */\n  --medium-blue:   #0A60FF; /* saturated mid blue */\n  --white:         #FFFFFF;\n\n  /* ---- Accent palette — pops only, never fills ---- */\n  --magenta: #FF007F;\n  --orange:  #FF9000;\n\n  /* ---- Neutral ramp (from theme grays) ---- */\n  --gray-050: #F2F3F5;\n  --gray-100: #D6D6D6;\n  --gray-200: #B4B9C0;\n  --gray-300: #9AA3AE;\n  --gray-400: #8A93A0;\n  --gray-500: #6B6B6B;\n  --gray-600: #525E6C;\n\n  /* ---- Navy surface ramp (dark template) ---- */\n  --navy-900: #07182D; /* base background */\n  --navy-800: #0B2138;\n  --navy-700: #102A45;\n  --navy-600: #173453;\n  --navy-500: #21415F;\n\n  /* ---- Brand gradients ----\n     Two gradient types only: Linear and Freeform (blurred).\n     Use for special emphasis only — never to fill boxes/containers. */\n  --grad-blue:   linear-gradient(120deg, var(--cisco-blue) 0%, var(--medium-blue) 100%);\n  --grad-sunset: linear-gradient(120deg, var(--orange) 0%, var(--magenta) 100%);\n  --grad-spectrum: linear-gradient(120deg, var(--orange) 0%, var(--magenta) 42%, var(--medium-blue) 100%);\n  --grad-glow: radial-gradient(120% 120% at 20% 15%, var(--cisco-blue) 0%, var(--medium-blue) 45%, var(--midnight-blue) 100%);\n\n  /* ============================================================\n     Semantic aliases — DEFAULT = dark template\n     ============================================================ */\n  --bg-base:        var(--midnight-blue);\n  --bg-elevated:    var(--navy-800);\n  --surface-card:   var(--navy-700);\n  --surface-subtle: rgba(255, 255, 255, 0.05);\n\n  --text-primary:   var(--white);\n  --text-secondary: var(--gray-200);\n  --text-muted:     var(--gray-400);\n  --text-accent:    var(--cisco-blue);\n  --text-on-accent: var(--midnight-blue);\n\n  --border-subtle:  rgba(255, 255, 255, 0.14);\n  --border-strong:  rgba(255, 255, 255, 0.28);\n\n  --accent:         var(--cisco-blue);\n  --accent-strong:  var(--medium-blue);\n  --link:           var(--cisco-blue);\n  --link-hover:     var(--white);\n}\n\n/* ============================================================\n   Light template scope — apply .cisco-light on a container\n   (logo/text become Midnight Blue on white)\n   ============================================================ */\n.cisco-light {\n  --bg-base:        var(--white);\n  --bg-elevated:    var(--gray-050);\n  --surface-card:   var(--white);\n  --surface-subtle: rgba(7, 24, 45, 0.04);\n\n  --text-primary:   var(--midnight-blue);\n  --text-secondary: var(--gray-600);\n  --text-muted:     var(--gray-500);\n  --text-accent:    var(--medium-blue);\n  --text-on-accent: var(--white);\n\n  --border-subtle:  rgba(7, 24, 45, 0.12);\n  --border-strong:  rgba(7, 24, 45, 0.24);\n\n  --accent:         var(--medium-blue);\n  --accent-strong:  var(--cisco-blue);\n  --link:           var(--medium-blue);\n  --link-hover:     var(--midnight-blue);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Cisco — Typography tokens\n   CiscoSansTT Medium → headings; CiscoSansTT (Regular) → body.\n   Type scale observed in template specimen: 40 / 32 / 28 / 24 / 20 (H1–H5),\n   16 body, 14 label. Presentation titles scale larger (48–72).\n   Rule: colored type is reserved for special callouts at H1–H5 only.\n   Subtitles, body, and labels are generally kept in the base text color.\n   ============================================================ */\n:root {\n  /* Families — 'Medium' role is Mulish 500/600, 'Regular' role is 400 */\n  --font-heading: 'Mulish', 'Helvetica Neue', Arial, sans-serif;\n  --font-body:    'Mulish', 'Helvetica Neue', Arial, sans-serif;\n\n  /* Weights */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */ /* CiscoSansTT Medium */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* ---- Display / presentation-scale (title & segue slides) ---- */\n  --fs-display:  72px;  --lh-display:  1.02; /* @kind other */\n  --fs-title:    54px;  --lh-title:    1.05; /* @kind other */\n\n  /* ---- Heading scale H1–H5 ---- */\n  --fs-h1: 40px; --lh-h1: 1.08; /* @kind other */\n  --fs-h2: 32px; --lh-h2: 1.12; /* @kind other */\n  --fs-h3: 28px; --lh-h3: 1.15; /* @kind other */\n  --fs-h4: 24px; --lh-h4: 1.2; /* @kind other */\n  --fs-h5: 20px; --lh-h5: 1.25; /* @kind other */\n\n  /* ---- Body & supporting ---- */\n  --fs-body-lg: 20px; --lh-body-lg: 1.5; /* @kind other */\n  --fs-body:    16px; --lh-body:    1.5; /* @kind other */\n  --fs-caption: 14px; --lh-caption: 1.45; /* @kind other */\n  --fs-label:   14px; --lh-label:   1.2; /* @kind other */\n  --fs-legal:   11px; --lh-legal:   1.35; /* @kind other */\n\n  /* ---- Tracking ---- */\n  --ls-tight:  -0.02em; /* @kind other */ /* large display */\n  --ls-normal:  0; /* @kind other */\n  --ls-label:   0.08em; /* @kind other */ /* eyebrow / all-caps labels */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Cisco — Spacing, radii, effects\n   16:9 slide canvas = 1280 × 720 (design px). Safe margin ≈ 64px.\n   ============================================================ */\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* ---- Slide geometry ---- */\n  --slide-w: 1280px;\n  --slide-h: 720px;\n  --slide-margin: 64px;   /* content safe area from edges */\n  --slide-gutter: 24px;   /* gap between columns / boxes */\n\n  /* ---- Corner radii ---- (template boxes are lightly rounded) */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 20px;\n  --radius-pill: 999px;\n\n  /* ---- Borders ---- */\n  --border-hairline: 1px;\n  --border-thick: 2px;\n\n  /* ---- Elevation / shadows ---- (subtle, from theme outerShdw) */\n  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);\n  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);\n  --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.40);\n  --glow-blue: 0 0 48px rgba(2, 200, 255, 0.35);\n\n  /* ---- Motion ---- (restrained: fades & gentle eases, no bounce) */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur-base: 240ms; /* @kind other */\n  --dur-slow: 420ms; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Cisco Design System — global stylesheet entry point.\n   Consumers lin l(\"2574ff91-4ff3-4f16-91b2-46660f000eb7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Mulish';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"fb9b61bf-5537-4760-9298-21b48f9c1fed\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   Cisco — Color tokens\n   Source of truth: \"Cisco Dark 04-01-2026\" theme (Cisco Template.pptx)\n   Primary palette: Cisco Blue, Midnight Blue, Medium Blue, White\n   Accent palette (use SPARINGLY, small pops only): Magenta, Orange\n   ============================================================ */\n:root {\n  /* ---- Primary brand palette ---- */\n  --cisco-blue:    #02C8FF; /* bright signature blue — primary accent */\n  --midnight-blue: #07182D; /* deep navy — dark-template background & logo */\n  --medium-blue:   #0A60FF; /* saturated mid blue */\n  --white:         #FFFFFF;\n\n  /* ---- Accent palette — pops only, never fills ---- */\n  --magenta: #FF007F;\n  --orange:  #FF9000;\n\n  /* ---- Neutral ramp (from theme grays) ---- */\n  --gray-050: #F2F3F5;\n  --gray-100: #D6D6D6;\n  --gray-200: #B4B9C0;\n  --gray-300: #9AA3AE;\n  --gray-400: #8A93A0;\n  --gray-500: #6B6B6B;\n  --gray-600: #525E6C;\n\n  /* ---- Navy surface ramp (dark template) ---- */\n  --navy-900: #07182D; /* base background */\n  --navy-800: #0B2138;\n  --navy-700: #102A45;\n  --navy-600: #173453;\n  --navy-500: #21415F;\n\n  /* ---- Brand gradients ----\n     Two gradient types only: Linear and Freeform (blurred).\n     Use for special emphasis only — never to fill boxes/containers. */\n  --grad-blue:   linear-gradient(120deg, var(--cisco-blue) 0%, var(--medium-blue) 100%);\n  --grad-sunset: linear-gradient(120deg, var(--orange) 0%, var(--magenta) 100%);\n  --grad-spectrum: linear-gradient(120deg, var(--orange) 0%, var(--magenta) 42%, var(--medium-blue) 100%);\n  --grad-glow: radial-gradient(120% 120% at 20% 15%, var(--cisco-blue) 0%, var(--medium-blue) 45%, var(--midnight-blue) 100%);\n\n  /* ============================================================\n     Semantic aliases — DEFAULT = dark template\n     ============================================================ */\n  --bg-base:        var(--midnight-blue);\n  --bg-elevated:    var(--navy-800);\n  --surface-card:   var(--navy-700);\n  --surface-subtle: rgba(255, 255, 255, 0.05);\n\n  --text-primary:   var(--white);\n  --text-secondary: var(--gray-200);\n  --text-muted:     var(--gray-400);\n  --text-accent:    var(--cisco-blue);\n  --text-on-accent: var(--midnight-blue);\n\n  --border-subtle:  rgba(255, 255, 255, 0.14);\n  --border-strong:  rgba(255, 255, 255, 0.28);\n\n  --accent:         var(--cisco-blue);\n  --accent-strong:  var(--medium-blue);\n  --link:           var(--cisco-blue);\n  --link-hover:     var(--white);\n}\n\n/* ============================================================\n   Light template scope — apply .cisco-light on a container\n   (logo/text become Midnight Blue on white)\n   ============================================================ */\n.cisco-light {\n  --bg-base:        var(--white);\n  --bg-elevated:    var(--gray-050);\n  --surface-card:   var(--white);\n  --surface-subtle: rgba(7, 24, 45, 0.04);\n\n  --text-primary:   var(--midnight-blue);\n  --text-secondary: var(--gray-600);\n  --text-muted:     var(--gray-500);\n  --text-accent:    var(--medium-blue);\n  --text-on-accent: var(--white);\n\n  --border-subtle:  rgba(7, 24, 45, 0.12);\n  --border-strong:  rgba(7, 24, 45, 0.24);\n\n  --accent:         var(--medium-blue);\n  --accent-strong:  var(--cisco-blue);\n  --link:           var(--medium-blue);\n  --link-hover:     var(--midnight-blue);\n}\n\n/* ============================================================\n   Cisco — Typography tokens\n   CiscoSansTT Medium → headings; CiscoSansTT (Regular) → body.\n   Type scale observed in template specimen: 40 / 32 / 28 / 24 / 20 (H1–H5),\n   16 body, 14 label. Presentation titles scale larger (48–72).\n   Rule: colored type is reserved for special callouts at H1–H5 only.\n   Subtitles, body, and labels are generally kept in the base text color.\n   ============================================================ */\n:root {\n  /* Families — 'Medium' role is Mulish 500/600, 'Regular' role is 400 */\n  --font-heading: 'Mulish', 'Helvetica Neue', Arial, sans-serif;\n  --font-body:    'Mulish', 'Helvetica Neue', Arial, sans-serif;\n\n  /* Weights */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */ /* CiscoSansTT Medium */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* ---- Display / presentation-scale (title & segue slides) ---- */\n  --fs-display:  72px;  --lh-display:  1.02; /* @kind other */\n  --fs-title:    54px;  --lh-title:    1.05; /* @kind other */\n\n  /* ---- Heading scale H1–H5 ---- */\n  --fs-h1: 40px; --lh-h1: 1.08; /* @kind other */\n  --fs-h2: 32px; --lh-h2: 1.12; /* @kind other */\n  --fs-h3: 28px; --lh-h3: 1.15; /* @kind other */\n  --fs-h4: 24px; --lh-h4: 1.2; /* @kind other */\n  --fs-h5: 20px; --lh-h5: 1.25; /* @kind other */\n\n  /* ---- Body & supporting ---- */\n  --fs-body-lg: 20px; --lh-body-lg: 1.5; /* @kind other */\n  --fs-body:    16px; --lh-body:    1.5; /* @kind other */\n  --fs-caption: 14px; --lh-caption: 1.45; /* @kind other */\n  --fs-label:   14px; --lh-label:   1.2; /* @kind other */\n  --fs-legal:   11px; --lh-legal:   1.35; /* @kind other */\n\n  /* ---- Tracking ---- */\n  --ls-tight:  -0.02em; /* @kind other */ /* large display */\n  --ls-normal:  0; /* @kind other */\n  --ls-label:   0.08em; /* @kind other */ /* eyebrow / all-caps labels */\n}\n\n/* ============================================================\n   Cisco — Spacing, radii, effects\n   16:9 slide canvas = 1280 × 720 (design px). Safe margin ≈ 64px.\n   ============================================================ */\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* ---- Slide geometry ---- */\n  --slide-w: 1280px;\n  --slide-h: 720px;\n  --slide-margin: 64px;   /* content safe area from edges */\n  --slide-gutter: 24px;   /* gap between columns / boxes */\n\n  /* ---- Corner radii ---- (template boxes are lightly rounded) */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 20px;\n  --radius-pill: 999px;\n\n  /* ---- Borders ---- */\n  --border-hairline: 1px;\n  --border-thick: 2px;\n\n  /* ---- Elevation / shadows ---- (subtle, from theme outerShdw) */\n  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);\n  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);\n  --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.40);\n  --glow-blue: 0 0 48px rgba(2, 200, 255, 0.35);\n\n  /* ---- Motion ---- (restrained: fades & gentle eases, no bounce) */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur-base: 240ms; /* @kind other */\n  --dur-slow: 420ms; /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"1d16e7cf-8802-4af2-8430-14ffaa7958d2\"><\u002Fscript>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"4bcccc8f-9c2f-4652-9b2a-149e5803ce4d#/deck-stage.js\" width=\"1280\" height=\"720\" hint-size=\"100%,100%\" data-uneditable=\"\">\n\n<section data-label=\"Title\" data-speaker-notes=\" Meeting Summary (working session hosted by Frank Seibold with Michael Mckeefry and Andre Lemos). Frank is an AI team champion, not a skeptic — management is pushing AI adoption, but the current CXAI Assistant does not meet day-to-day managerial needs, which has caused limited adoption and burned Frank's advocacy capital. Core diagnosis: the Assistant was built for deal-level/specialist-level lookup, but managers need aggregation, comparison, and orchestration support.\" style=\"position:relative;width:100%;height:100%;background:var(--bg-base);overflow:hidden;display:flex;flex-direction:column;padding:64px;\">\n  <div style=\"position:absolute;inset:0;background:var(--grad-glow);opacity:0.32;filter:blur(30px);\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:1;display:flex;flex-direction:column;height:100%;justify-content:center;max-width:920px;\">\n    <x-import component-from-global-scope=\"CiscoDesignSystem_7616d0.Logo\" height=\"40\" hint-size=\"76px,40px\"><\u002Fx-import>\n    <div style=\"margin-top:40px;\">\n      <x-import component-from-global-scope=\"CiscoDesignSystem_7616d0.Eyebrow\" accent=\"{{ true }}\" hint-size=\"auto,18px\">Working session findings<\u002Fx-import>\n    <\u002Fdiv>\n    <h1 style=\"margin:14px 0 0;font-family:var(--font-heading);font-weight:var(--fw-medium);font-size:44px;line-height:1.1;color:var(--text-primary);letter-spacing:var(--ls-tight);\">CXAI Assistant: Manager Pain Points &amp; the False Attrition Opportunity<\u002Fh1>\n    <p style=\"margin:20px 0 0;font-size:var(--fs-body-lg);line-height:var(--lh-body-lg);color:var(--text-secondary);font-weight:400;max-width:760px;\">Findings from Frank Seibold's Core Operational Pain Points documentation and the working session<\u002Fp>\n    <p style=\"margin:16px 0 0;font-size:var(--fs-caption);color:var(--text-muted);\">Working session Hosted by Frank Seibold, Renewals Manager (Security)&nbsp; with Michael Mckeefry and Andre Lemos<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"position:relative;z-index:1;margin-top:auto;\">\n    <x-import component-from-global-scope=\"CiscoDesignSystem_7616d0.SlideFooter\" page=\"1\" hint-size=\"100%,32px\"><\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Four Core Pain Points\" data-speaker-notes=\"Four Core Pain Points. Also discussed in the meeting summary. Frank is a Security renewals manager and AI champion; these four pain points are the documented reasons adoption has stayed limited despite management pressure to use the Assistant.\" style=\"position:relative;width:100%;height:100%;background:var(--bg-elevated);overflow:hidden;display:flex;flex-direction:column;padding:56px 64px;\">\n  <x-import component-from-global-scope=\"CiscoDesignSystem_7616d0.Eyebrow\" accent=\"{{ true }}\" hint-size=\"auto,18px\">Diagnosis<\u002Fx-import>\n  <h2 style=\"margin:8px 0 0;font-family:var(--font-heading);font-weight:var(--fw-medium);font-size:var(--fs-h1);line-height:var(--lh-h1);color:var(--text-primary);\">Four core pain points behind low adoption<\u002Fh2>\n  <p style=\"margin:8px 0 0;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-secondary);max-width:900px;\">The Assistant answers deal-level lookup questions well — managers need aggregation, comparison, and orchestration instead.<br><strong style=\"color: rgb(255, 255, 255); font-size: 15px;\">Cross-cutting theme:<\u002Fstrong><span style=\"color: rgb(255, 255, 255); font-size: 15px; background-color: rgba(2, 200, 255, 0.12);\"> Frank wants the Assistant to act as a \"thought partner\" — a 24/7 <\u002Fspan><strong style=\"color: rgb(255, 255, 255); font-size: 15px;\">chatbot consultant<\u002Fstrong><span style=\"color: rgb(255, 255, 255); font-size: 15px; background-color: rgba(2, 200, 255, 0.12);\"> that coaches managers through deal assessments by asking questions, not just retrieving data<\u002Fspan><\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;flex:1;min-height:0;margin-top:20px;\">\n\n    <div style=\"display:flex;flex-direction:column;padding:20px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);border-top:3px solid var(--magenta);\">\n      <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--magenta)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:10px;\"><path d=\"M4 4h7v7H4z\"><\u002Fpath><path d=\"M13 13h7v7h-7z\"><\u002Fpath><path d=\"M11 7.5h6M17 16.5H7\"><\u002Fpath><path d=\"M15 5.5l2 2-2 2M9 14.5l-2 2 2 2\"><\u002Fpath><\u002Fsvg>\n      <div style=\"font-size:13px;font-weight:var(--fw-semibold);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--magenta);margin-bottom:8px;\">\"Shadow Reporting\" Burden<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.5;color:var(--text-secondary);flex:1;\">\n        <p style=\"margin-bottom:7px;\">Managers manually reconcile <strong style=\"color:var(--text-primary);\">SFDC<\u002Fstrong> (operational) vs. <strong style=\"color:var(--text-primary);\">OSBO<\u002Fstrong> (financial) data — the systems don't align and lack matching granularity.<\u002Fp>\n        <p style=\"margin-bottom:7px;\"><strong style=\"color:var(--text-primary);\">Root cause:<\u002Fstrong> PMG vs. Sub-BE mismatch.<\u002Fp>\n        <p style=\"margin-bottom:7px;\">Produces <strong style=\"color:var(--text-primary);\">\"false attrition\"<\u002Fstrong> — migrated/consolidated/re-papered revenue miscounted as churn — and a trust gap where leadership debates data validity instead of strategy.<\u002Fp>\n        <p style=\"color:var(--text-muted);font-style:italic;\">AI does not help with this today.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;padding:20px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);border-top:3px solid var(--medium-blue);\">\n      <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--medium-blue)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:10px;\"><path d=\"M2 12h4l2-7 4 14 2-7h8\"><\u002Fpath><\u002Fsvg>\n      <div style=\"font-size:13px;font-weight:var(--fw-semibold);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--medium-blue);margin-bottom:8px;\">Invisible GTM Execution<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.5;color:var(--text-secondary);flex:1;\">\n        <p style=\"margin-bottom:7px;\">Managers cannot see whether GTM initiatives — e.g. the <strong style=\"color:var(--text-primary);\">Umbrella → Secure Access<\u002Fstrong> migration — are actually being executed by their team.<\u002Fp>\n        <p>No way to measure growth-motion <strong style=\"color:var(--text-primary);\">attach rates<\u002Fstrong> or specialist-level initiative execution.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;padding:20px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);border-top:3px solid var(--magenta);\">\n      <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--magenta)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:10px;\"><path d=\"M12 9v4M12 17h.01\"><\u002Fpath><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z\"><\u002Fpath><\u002Fsvg>\n      <div style=\"font-size:13px;font-weight:var(--fw-semibold);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--magenta);margin-bottom:8px;\">Admin Overload vs. Risk Management<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.5;color:var(--text-secondary);flex:1;\">\n        <p style=\"margin-bottom:7px;\">Sub-$50K deals get <strong style=\"color:var(--text-primary);\">little/no risk scrutiny<\u002Fstrong>; opportunity note quality is inconsistent across specialists.<\u002Fp>\n        <p>Managers manually research risk factors, producing <strong style=\"color:var(--text-primary);\">subjective, hard-to-compare<\u002Fstrong> judgements and forecast inaccuracy.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;padding:20px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);border-top:3px solid var(--medium-blue);\">\n      <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--medium-blue)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:10px;\"><path d=\"M7 7h10M7 7l3-3M7 7l3 3\"><\u002Fpath><path d=\"M17 17H7M17 17l-3 3M17 17l-3-3\"><\u002Fpath><\u002Fsvg>\n      <div style=\"font-size:13px;font-weight:var(--fw-semibold);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--medium-blue);margin-bottom:8px;\">Process Ambiguity &amp; Redundancy<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.5;color:var(--text-secondary);flex:1;\">\n        <p style=\"margin-bottom:7px;\">Opportunities are \"touched\" by both the <strong style=\"color:var(--text-primary);\">renewal team<\u002Fstrong> and the <strong style=\"color:var(--text-primary);\">Renewal Center<\u002Fstrong> with no clear ownership/routing rules.<\u002Fp>\n        <p>The burden of resolving overlap falls on managers; existing prompts to flag Renewal Center involvement are limited by <strong style=\"color:var(--text-primary);\">poor underlying data<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  \n\n  <x-import component-from-global-scope=\"CiscoDesignSystem_7616d0.SlideFooter\" page=\"2\" style=\"margin-top:14px;\" hint-size=\"100%,32px\"><\u002Fx-import>\n<\u002Fsection>\n\n<section data-label=\"False Attrition\" data-speaker-notes=\"Source: 'Shadow Reporting' Burden) and the meeting summary. This was the single explicit prioritization agreement reached in the meeting — the team agreed false attrition is the critical initial focus area, and Michael committed to escalating it within leadership. No specific hours-saved figure was recorded in the source material; the qualitative framing above (largest identified source of recurring manual work) is intentional and should not be replaced with an invented number.\" style=\"position:relative;width:100%;height:100%;background:var(--bg-base);overflow:hidden;display:flex;flex-direction:column;padding:56px 64px;\">\n  <x-import component-from-global-scope=\"CiscoDesignSystem_7616d0.Eyebrow\" accent=\"{{ true }}\" hint-size=\"auto,18px\">Agreed priority #1<\u002Fx-import>\n  <h2 style=\"margin:8px 0 0;font-family:var(--font-heading);font-weight:var(--fw-medium);font-size:var(--fs-h1);line-height:var(--lh-h1);color:var(--cisco-blue);\">False attrition: the agreed priority #1<\u002Fh2>\n  <p style=\"margin:8px 0 0;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-secondary);max-width:900px;\">Revenue that migrated, consolidated, or was re-papered — but reports as churn<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;min-height:0;margin-top:18px;\">\n    <div style=\"display:flex;flex-direction:column;padding:20px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);border-top:3px solid var(--cisco-blue);\">\n      <div style=\"font-size:13px;font-weight:var(--fw-semibold);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--cisco-blue);margin-bottom:10px;\">What's Actually Happening<\u002Fdiv>\n      <p style=\"font-size:14px;line-height:1.5;color:var(--text-secondary);margin-bottom:10px;\">A predecessor contract's revenue migrates to another product/SKU, gets consolidated, or is re-papered into a different contract vehicle — but there is <strong style=\"color:var(--text-primary);\">no linkage<\u002Fstrong> between the predecessor and successor contract.<\u002Fp>\n      <svg sc-camel-view-box=\"0 0 460 130\" width=\"100%\" height=\"150\" role=\"img\" aria-label=\"Diagram showing predecessor contract migrating to successor contract, misreported as attrition\">\n        <rect x=\"8\" y=\"14\" width=\"130\" height=\"38\" rx=\"4\" fill=\"none\" stroke=\"var(--cisco-blue)\" stroke-width=\"1.6\"><\u002Frect>\n        <text x=\"73\" y=\"38\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"11\" font-weight=\"700\">Predecessor Contract<\u002Ftext>\n        <path d=\"M138 33 H196\" stroke=\"var(--cisco-blue)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrowHead)\"><\u002Fpath>\n        <text x=\"167\" y=\"24\" text-anchor=\"middle\" fill=\"var(--text-muted)\" font-size=\"8.5\">migrate / consolidate / re-paper<\u002Ftext>\n        <rect x=\"196\" y=\"14\" width=\"130\" height=\"38\" rx=\"4\" fill=\"none\" stroke=\"var(--cisco-blue)\" stroke-width=\"1.6\"><\u002Frect>\n        <text x=\"261\" y=\"38\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"11\" font-weight=\"700\">Successor Contract<\u002Ftext>\n        <path d=\"M73 52 V80 H261 V52\" stroke=\"var(--text-muted)\" stroke-width=\"1.2\" fill=\"none\" stroke-dasharray=\"4 3\"><\u002Fpath>\n        <text x=\"167\" y=\"72\" text-anchor=\"middle\" fill=\"var(--text-muted)\" font-size=\"8\" font-style=\"italic\">no linkage recorded between the two<\u002Ftext>\n        <path d=\"M261 52 V92\" stroke=\"#FF4D4F\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrowRed)\"><\u002Fpath>\n        <rect x=\"196\" y=\"92\" width=\"130\" height=\"30\" rx=\"4\" fill=\"rgba(255,77,79,0.12)\" stroke=\"#FF4D4F\" stroke-width=\"1.4\"><\u002Frect>\n        <text x=\"261\" y=\"111\" text-anchor=\"middle\" fill=\"#FF4D4F\" font-size=\"10.5\" font-weight=\"700\">Reported: Attrition ✗<\u002Ftext>\n        <path d=\"M167 80 V102 H196\" stroke=\"#3DDC84\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrowGreen)\"><\u002Fpath>\n        <rect x=\"8\" y=\"92\" width=\"150\" height=\"30\" rx=\"4\" fill=\"rgba(61,220,132,0.12)\" stroke=\"#3DDC84\" stroke-width=\"1.4\"><\u002Frect>\n        <text x=\"83\" y=\"111\" text-anchor=\"middle\" fill=\"#3DDC84\" font-size=\"10.5\" font-weight=\"700\">Should be: Migration ✓<\u002Ftext>\n        <defs>\n          <marker id=\"arrowHead\" sc-camel-marker-width=\"8\" sc-camel-marker-height=\"8\" sc-camel-ref-x=\"6\" sc-camel-ref-y=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--cisco-blue)\"><\u002Fpath><\u002Fmarker>\n          <marker id=\"arrowRed\" sc-camel-marker-width=\"8\" sc-camel-marker-height=\"8\" sc-camel-ref-x=\"6\" sc-camel-ref-y=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#FF4D4F\"><\u002Fpath><\u002Fmarker>\n          <marker id=\"arrowGreen\" sc-camel-marker-width=\"8\" sc-camel-marker-height=\"8\" sc-camel-ref-x=\"6\" sc-camel-ref-y=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#3DDC84\"><\u002Fpath><\u002Fmarker>\n        <\u002Fdefs>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;padding:20px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);border-top:3px solid var(--orange);\">\n      <div style=\"font-size:13px;font-weight:var(--fw-semibold);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--orange);margin-bottom:10px;\">Why This Is Priority #1<\u002Fdiv>\n      <div style=\"font-size:12.5px;line-height:1.38;color:var(--text-secondary);flex:1;min-height:0;\">\n        <p style=\"margin-bottom:6px;\">The single explicit prioritization agreement from the 4 Sept meeting: the team agreed to prioritize resolving false attrition and developing <strong style=\"color:var(--text-primary);\">true attrition visibility at the PMG level<\u002Fstrong>. Michael committed to escalating this within leadership.<\u002Fp>\n        <p>It is the <strong style=\"color:var(--text-primary);\">largest identified source of recurring manual work<\u002Fstrong> — reconciled by managers every cycle, then re-debated by leadership. It is the root cause of the trust gap undermining every other Assistant output, and resolving it is a prerequisite for measuring GTM execution.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;\">\n        <div style=\"padding:9px 11px;background:var(--surface-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);\">\n          <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);\">Proposed KPI 1<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--text-primary);font-weight:600;margin-top:3px;line-height:1.3;\">Reduction in manual reconciliation hours per manager, per cycle<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:9px 11px;background:var(--surface-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);\">\n          <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);\">Proposed KPI 2<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--text-primary);font-weight:600;margin-top:3px;line-height:1.3;\">% of former attrition volume reclassified as migration/consolidation (\"false attrition rate\")<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:14px;padding:16px 22px;background:rgba(2,200,255,0.08);border:1px solid rgba(2,200,255,0.35);border-left:4px solid var(--cisco-blue);border-radius:var(--radius-sm);\">\n    <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--cisco-blue);font-weight:700;margin-bottom:6px;\">Proposed New Assistant Prompt<\u002Fdiv>\n    <div style=\"font-size:17px;font-weight:300;color:var(--text-primary);line-height:1.4;font-style:italic;\">\"Show me everything currently counted as attrition that is probably false attrition, and explain why.\"<\u002Fdiv>\n    <div style=\"margin-top:8px;font-size:13px;color:var(--text-secondary);\">Expected output: a <strong style=\"color:var(--cisco-blue);\">ranked list<\u002Fstrong> of at-risk attrition lines with evidence per line and a <strong style=\"color:var(--cisco-blue);\">one-click confirm/override<\u002Fstrong>. Once confirmed as \"migration, not attrition,\" the classification is written back and persists — never manually re-derived in a future cycle.<\u002Fdiv>\n    <div style=\"margin-top:6px;font-size:13px;color:var(--text-secondary);\">Companion agreed-priority prompt: <strong style=\"color:var(--cisco-blue);\">\"What is my true attrition at PMG level for [period], excluding migrations and consolidations?\"<\u002Fstrong><\u002Fdiv>\n  <\u002Fdiv>\n\n  <x-import component-from-global-scope=\"CiscoDesignSystem_7616d0.SlideFooter\" page=\"3\" style=\"margin-top:12px;\" hint-size=\"100%,32px\"><\u002Fx-import>\n<\u002Fsection>\n\n<section data-label=\"Recommendations\" data-speaker-notes=\"Meeting Summary minute session hosted by Frank Seibold with Michael Mckeefry and Andre Lemos. Phase 1 sequencing (build → define → publish → protect time) is a recommended structure derived from the pain points and the meeting's single explicit agreement on false attrition; it is not itself a verbatim commitment beyond Michael's escalation commitment.\" style=\"position:relative;width:100%;height:100%;background:var(--bg-elevated);overflow:hidden;display:flex;flex-direction:column;padding:56px 64px;\">\n  <x-import component-from-global-scope=\"CiscoDesignSystem_7616d0.Eyebrow\" accent=\"{{ true }}\" hint-size=\"auto,18px\">Path forward<\u002Fx-import>\n  <h2 style=\"margin:8px 0 0;font-family:var(--font-heading);font-weight:var(--fw-medium);font-size:var(--fs-h1);line-height:var(--lh-h1);color:var(--text-primary);\">Recommendations &amp; next steps<\u002Fh2>\n  <p style=\"margin:8px 0 0;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-secondary);max-width:900px;\">False attrition is the first priority<\u002Fp>\n\n  <div style=\"position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:26px 0 6px;margin-top:8px;\">\n    <div style=\"position:absolute;left:0;right:0;top:38px;height:2px;background:var(--grad-blue);\"><\u002Fdiv>\n    <div style=\"position:relative;padding-top:46px;\">\n      <div style=\"position:absolute;top:29px;left:0;width:16px;height:16px;border-radius:50%;background:var(--cisco-blue);box-shadow:0 0 0 4px var(--bg-elevated);\"><\u002Fdiv>\n      <div style=\"font-weight:700;color:var(--cisco-blue);font-size:12px;letter-spacing:var(--ls-label);text-transform:uppercase;\">Phase 1 · Build<\u002Fdiv>\n      <div style=\"color:var(--text-secondary);margin-top:6px;font-size:14px;line-height:1.4;\">Build the reconciliation/entity-resolution service behind the new prompts — <strong style=\"color:var(--text-primary);\">compute in a deterministic service<\u002Fstrong>; the Assistant narrates/explains, it does not compute via the LLM.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;padding-top:46px;\">\n      <div style=\"position:absolute;top:29px;left:0;width:16px;height:16px;border-radius:50%;background:var(--cisco-blue);box-shadow:0 0 0 4px var(--bg-elevated);\"><\u002Fdiv>\n      <div style=\"font-weight:700;color:var(--cisco-blue);font-size:12px;letter-spacing:var(--ls-label);text-transform:uppercase;\">Phase 1 · Define<\u002Fdiv>\n      <div style=\"color:var(--text-secondary);margin-top:6px;font-size:14px;line-height:1.4;\">Operational team first agrees the upstream definitions engineering can't invent: a standard reconciled SFDC/OSBO report, a versioned <strong style=\"color:var(--text-primary);\">Sub-BE → PMG mapping<\u002Fstrong>, and a false-attrition classification taxonomy.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;padding-top:46px;\">\n      <div style=\"position:absolute;top:29px;left:0;width:16px;height:16px;border-radius:50%;background:var(--cisco-blue);box-shadow:0 0 0 4px var(--bg-elevated);\"><\u002Fdiv>\n      <div style=\"font-weight:700;color:var(--cisco-blue);font-size:12px;letter-spacing:var(--ls-label);text-transform:uppercase;\">Phase 1 · Publish<\u002Fdiv>\n      <div style=\"color:var(--text-secondary);margin-top:6px;font-size:14px;line-height:1.4;\">Publish \"true attrition at PMG level\" as <strong style=\"color:var(--text-primary);\">one standard, shared, leadership-facing artefact<\u002Fstrong> — replacing manager-by-manager spreadsheets.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;padding-top:46px;\">\n      <div style=\"position:absolute;top:29px;left:0;width:16px;height:16px;border-radius:50%;background:var(--cisco-blue);box-shadow:0 0 0 4px var(--bg-elevated);\"><\u002Fdiv>\n      <div style=\"font-weight:700;color:var(--cisco-blue);font-size:12px;letter-spacing:var(--ls-label);text-transform:uppercase;\">Ongoing<\u002Fdiv>\n      <div style=\"color:var(--text-secondary);margin-top:6px;font-size:14px;line-height:1.4;\">Protect the reclaimed time — reinvest it explicitly into <strong style=\"color:var(--text-primary);\">1:1 coaching and proactive risk management<\u002Fstrong>, not new reporting asks.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;\">\n    <div style=\"padding:16px 20px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);border-top:3px solid var(--cisco-blue);\">\n      <div style=\"font-size:13px;font-weight:700;color:var(--cisco-blue);margin-bottom:6px;\">Follow-Up Action 1<\u002Fdiv>\n      <div style=\"font-size:14px;color:var(--text-secondary);line-height:1.4;\">Present to the <strong style=\"color: var(--text-primary);\">AI Adoption team<\u002Fstrong>&nbsp;to secure sponsorship and prioritization for Phase 1.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:16px 20px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);border-top:3px solid var(--medium-blue);\">\n      <div style=\"font-size:13px;font-weight:700;color:var(--medium-blue);margin-bottom:6px;\">Follow-Up Action 2<\u002Fdiv>\n      <div style=\"font-size:14px;color:var(--text-secondary);line-height:1.4;\">Circle back to <strong style=\"color:var(--text-primary);\">Frank Seibold<\u002Fstrong> to confirm these findings accurately reflect his intent before further scoping.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:14px;padding:14px 20px;border-radius:var(--radius-sm);background:rgba(2,200,255,0.12);border-left:4px solid var(--cisco-blue);font-size:14px;line-height:1.4;color:var(--text-primary);\">\n    This is a proposal for prioritization, not a committed roadmap — false attrition was the one item the room agreed on; everything else here is a recommendation built from that agreement.\n  <\u002Fdiv>\n\n  <x-import component-from-global-scope=\"CiscoDesignSystem_7616d0.SlideFooter\" page=\"4\" style=\"margin-top:10px;\" hint-size=\"100%,32px\"><\u002Fx-import>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
